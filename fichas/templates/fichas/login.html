{% extends 'fichas/base.html' %}
{% block conteudo %}
<style>
    .form-neon input { background-color: #0b132b; color: #fff; border: 1px solid #ff5e00; width: 100%; padding: 8px; border-radius: 5px; margin-bottom: 10px; }
    .form-neon label { color: #e0e1dd; font-weight: bold; }
    .form-neon .errorlist { color: #ff003c; text-shadow: 0 0 8px #ff003c; list-style-type: none; padding-left: 0; font-weight: bold; border: 1px dashed #ff003c; padding: 10px; border-radius: 5px; background-color: rgba(255, 0, 60, 0.1); }
</style>
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4" style="background-color: #050a1f; border: 1px solid #ff5e00; box-shadow: 0 0 15px rgba(255, 94, 0, 0.4); border-radius: 12px;">
            <h2 class="text-center mb-4" style="color: #ff5e00; text-shadow: 0 0 8px #ff5e00;">ACESSAR CONTA</h2>
            <form method="post" class="form-neon">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn w-100 mt-3" style="background-color: #ff5e00; color: #000; font-weight: bold; box-shadow: 0 0 10px #ff5e00;">ENTRAR</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
